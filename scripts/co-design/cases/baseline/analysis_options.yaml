general:
  folder_output: ../../../../data/co-design/baseline/
  fname_output: baseline

design_variables:
  blade:
    structure:
      - layer_name: Spar_Cap_SS
        n_opt: 4               # Number of control points along blade span
        max_decrease: 0.7      # Maximum nondimensional decrease at the n_opt locations
        max_increase: 1.3      # Maximum nondimensional increase at the n_opt locations
        index_start: 1         # Lock the first DV from blade root
        index_end: 3           # The last DV at blade tip is locked
      - layer_name: Spar_Cap_PS
        n_opt: 4               # Number of control points along blade span
        max_decrease: 0.7      # Maximum nondimensional decrease at the n_opt locations
        max_increase: 1.3      # Maximum nondimensional increase at the n_opt locations
        index_start: 1         # Lock the first DV from blade root
        index_end: 3           # The last DV at blade tip is locked
  control:
    ps_percent:  # default = 0.8
      flag: true
      lower_bound: 0.6
      upper_bound: 1.0
  hub:
    cone:  # default = 0.06981317007977318 rad = 4 deg
      flag: true
      lower_bound: 0.0
      upper_bound: 0.5235987756  # 0.5235987756 rad = 30 deg
  drivetrain:
    uptilt:  # default = 0.10471975511965977 = 6 deg
      flag: true
      lower_bound: 0.0
      upper_bound: 0.5235987756  # 0.5235987756 rad = 30 deg
    # overhang:  # default = 12.0313
    #   flag: true
    #   lower_bound: 0.1
    #   upper_bound: 30.0

# merit_figure_user: 
#   name: aeroelastic.AEP
#   ref: 82108621.30139959
#   max_flag: true
    
merit_figure: blade_mass
    
constraints:
  openfast_failed:
    flag: true
  blade:
    strains_spar_cap_ss:
      flag: True         # Flag to impose constraints on maximum strains (absolute value) in the spar cap on the blade suction side
      max:    4000.e-6   # Value of maximum strains [-]
      index_start: 1     # Do not enforce constraint at the first station from blade root of the n_opt from spar_cap_ss
      index_end: 3       # Do not enforce constraint at the last station at blade tip of the n_opt from spar_cap_ss
    strains_spar_cap_ps:
      flag: True         # Flag to impose constraints on maximum strains (absolute value) in the spar cap on the blade pressure side
      max:    4000.e-6   # Value of maximum strains [-]
      index_start: 1     # Do not enforce constraint at the first station from blade root of the n_opt from spar_cap_ps
      index_end: 3       # Do not enforce constraint at the last station at blade tip of the n_opt from spar_cap_ps
  user:
    - name: aeroelastic.AEP
      lower_bound: [82108621.30139959]
      upper_bound: [999999999999]
      ref: [82108621.30139959]
    - name: aeroelastic.minimum_eff_tower_clearance
      lower_bound: [15.893091360727944]
      upper_bound: [1000]
      ref: [15.893091360727944]
    - name: aeroelastic.max_eff_RootMyb
      lower_bound: [0.0]
      upper_bound: [104697.29296875]
      ref: [104697.29296875]
    - name: aeroelastic.max_eff_TwrBsMyt
      lower_bound: [0.0]
      upper_bound: [356416.7864583333]
      ref: [356416.7864583333]
    - name: aeroelastic.DEL_TwrBsMyt
      lower_bound: [0.0]
      upper_bound: [49976.581934041016]
      ref: [49976.581934041016]
    - name: aeroelastic.DEL_RootMyb
      lower_bound: [0.0]
      upper_bound: [22115.983753505523]
      ref: [22115.983753505523]

driver:
  optimization:
    flag: true
    max_iter: 100
    solver: LN_COBYLA  # LN_COBYLA (compared to COBYLA) has better bounds constraints and has better convergence/termination according to the NLOpt website.


recorder:
  flag: true
  file_name: baseline.sql
  includes: ["aeroelastic.*", "tune_rosco_ivc.*"]  # Just "*" doesn't work due to some non-uniqueness problem.
